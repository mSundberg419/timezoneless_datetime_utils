[project]
name = "timezoneless-datetime-utils"
version = "0.1.1"
description = "Timezone-naive datetime wrapper with a seconds-based Duration type"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
